<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clipperzinho notes</title>
    <link rel="icon" href="icons/icon-48.png" />
    <link rel="stylesheet" href="notes.css" />
  </head>
  <body>
    <header>
      <h1>Notes</h1>
      <input id="search" type="search" placeholder="Search notes" aria-label="Search notes" />
      <button id="export" type="button">Export Markdown</button>
    </header>
    <main>
      <p id="empty" hidden></p>
      <ul id="notes"></ul>
    </main>
    <dialog id="viewer" aria-label="Snapshot">
      <img alt="" />
    </dialog>
    <script type="module" src="notes.js"></script>
  </body>
</html>
